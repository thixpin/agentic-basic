<!doctype html>
<html lang="my">
  <head>
    <meta charset="utf-8" />
    <!-- Front cover, 170 × 240 mm. Render: md2book cover cover/cover.html -->
    <style>
      @page {
        size: 170mm 240mm;
        margin: 0;
      }
      html,
      body {
        margin: 0;
      }
      body {
        width: 170mm;
        height: 240mm;
        overflow: hidden;
        position: relative;
        background: #f7f8f6;
        color: #2b3136;
        font-family: "Noto Sans Myanmar", sans-serif;
      }
      .band {
        position: absolute;
        inset: 0 auto 0 0;
        width: 6mm;
        background: #5fbfae;
      }
      header {
        position: absolute;
        top: 30mm;
        left: 16mm;
        right: 14mm;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 44pt;
        font-weight: 700;
        letter-spacing: 0.02em;
        line-height: 1.1;
      }
      .sub {
        margin: 3mm 0 0;
        font-size: 22pt;
        font-weight: 600;
      }
      .rule {
        width: 24mm;
        height: 1.2mm;
        margin: 7mm auto 6mm;
        border-radius: 1mm;
        background: #5fbfae;
      }
      .my {
        margin: 0;
        font-size: 13.5pt;
        line-height: 1.7;
        color: #3d4a52;
      }
      svg {
        position: absolute;
        top: 104mm;
        left: 14mm;
        width: 144mm;
      }
      footer {
        position: absolute;
        left: 16mm;
        right: 14mm;
        bottom: 16mm;
        text-align: center;
        color: #5b6770;
      }
      .guide {
        margin: 0 0 7mm;
        font-size: 12pt;
        line-height: 1.55;
      }
      .author {
        margin: 0;
        font-size: 13pt;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #2b3136;
      }
    </style>
  </head>
