# Generated by md2book 0.5.0 (md2book deploy github-pages).
# Builds the web edition of the book and deploys it to GitHub Pages.
# Before the first run: Settings → Pages → Build and deployment → Source: GitHub Actions, and
# Settings → Environments → github-pages → Deployment branches and tags → add the tag rule v*.
# Site URL: web_url in book.json (https://agentic-basic.thixpin.me/).
name: Deploy web edition to GitHub Pages

on:
  # Deploys when a version tag is pushed: git tag v1.0.0 && git push origin v1.0.0
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: md2book-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "."
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - id: pages
        uses: actions/configure-pages@v6
      - name: Install md2book and Chromium
        run: |
          npm install -g @thixpin/md2book@0.5.0
          node "$(npm root -g)/@thixpin/md2book/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Fetch the fonts
        run: md2book fonts --config "book.json"
      - name: Build the web edition
        run: md2book build web --config "book.json" --out dist/pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "dist/pages/web"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
